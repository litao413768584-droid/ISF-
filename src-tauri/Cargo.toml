[package]
name = "seafarer-work-rest-log"
version = "1.0.0"
description = "STCW 2010 / MLC 2006 Seafarer Work & Rest Hours Log System"
authors = ["Shipmaster"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
