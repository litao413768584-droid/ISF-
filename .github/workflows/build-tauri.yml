name: Build Portable Windows EXE (Tauri)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Frontend & Tauri Standalone App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'STCW 船员工时休息记录系统 v__VERSION__'
          releaseBody: 'STCW 2010 / MLC 2006 船员工时休息记录系统 - 免安装绿色独立可执行文件 (.exe)'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeafarerWorkRestLog-Windows-Exe
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
