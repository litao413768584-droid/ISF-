name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Create icons folder and icon.ico
        run: |
          # 创建 icons 文件夹
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          
          # 生成图标
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(64, 64)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::RoyalBlue)
          $g.DrawString("ISF", (New-Object System.Drawing.Font("Arial",20)), [System.Drawing.Brushes]::White, 12, 20)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          $icon.Save($fs)
          $fs.Close()
        shell: powershell

      - name: Install dependencies
        run: |
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue .\node_modules
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue .\package-lock.json
          npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: isf-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: error